ver)", "value": 256, "after": 128, "text": "256-bit", "afterText": "128-bit: still secure", "color": "#34D399"}], "note": "Shor: exponential speed-up · Grover: quadratic speed-up"}, "say": ["Welcome to Chapter 3, the Future of AI Cybersecurity: Quantum Computing and Beyond.", "Quantum computers work in a fundamentally different way from ordinary ones. For a few specific problems, that makes them dramatically faster.", "Two quantum algorithms matter most for security.", "The first is Shor's algorithm. It gives an exponential speed-up at factoring large numbers and solving the discrete logarithm problem.", "RSA encryption relies on factoring being hard. Elliptic-curve cryptography, ECC, relies on discrete logarithms. A large enough quantum computer running Shor's algorithm would break both completely.", "That matters because RSA and ECC protect website connections, digital signatures and key exchange almost everywhere.", "The second is Grover's algorithm. It gives only a quadratic speed-up for searching. In effect it halves the security strength of symmetric encryption like AES.", "AES-128 drops to about 64 bits of effective strength.", "AES-256 drops to about 128 bits, which is still considered secure.", "So the lesson is: replace public-key encryption, and use longer symmetric keys. And remember, a quantum computer big enough to do this does not exist yet."], "hl": [null, null, null, null, 0, 0, 0, 0, 0, 1, 2, 2, 2, 2, 3, -1, -1]}], "keyPoint": "Shor's algorithm completely breaks RSA and ECC; Grover's only halves symmetric strength. Replace public-key cryptography and use AES-256.", "plain": ["RSA and ECC lock most of the internet; Shor's algorithm opens them.", "AES is only weakened; doubling the key length restores safety.", "The machines able to do this are still years away."], "check": {"q": "Which encryption remains secure against a large quantum computer, according to the chapter?", "o": ["ECC P-256", "RSA-2048", "AES-256"], "a": 2, "e": "Grover's algorithm reduces AES-256 to about 128-bit strength, still considered secure.", "retry": {"q": "Which quantum algorithm breaks RSA?", "o": ["Grover's algorithm", "Shor's algorithm", "FedAvg"], "a": 1, "e": "Shor's algorithm factors large numbers efficiently."}}, "scenario": {"title": "The crypto inventory", "setting": "You are listing the encryption used by your organisation to plan for quantum risk.", "steps": [{"prompt": "Your VPN uses RSA-2048 for key exchange and AES-256 for data. Which is the bigger quantum risk?", "choices": [{"t": "Neither", "s": 0, "fb": "No. RSA is critically exposed."}, {"t": "AES-256", "s": 0, "fb": "No. Grover only halves it to about 128-bit strength."}, {"t": "RSA-2048: Shor's algorithm breaks it completely", "s": 2, "fb": "Right. AES-256 remains secure; RSA does not."}]}, {"prompt": "A colleague says: 'Quantum computers already break RSA, we're too late.' What do you say?", "choices": [{"t": "Not yet; large enough machines don't exist, but we must prepare now", "s": 2, "fb": "Right. The threat is future, but preparation is urgent, as the next lesson shows."}, {"t": "Agree and give up", "s": 0, "fb": "No. This is a common misconception."}, {"t": "Quantum will never matter", "s": 0, "fb": "No. The chapter treats it as a serious, coming threat."}]}]}}, {"title": "Harvest now, decrypt later", "minutes": 2, "slides": [{"scene": {"type": "timeline", "title": "Harvest now, decrypt later", "subtitle": "Projected timeline from the chapter (projections, not certainties)", "arc": "Data stolen and stored today → decrypted years later", "items": [{"when": "Now", "date": "chapter: 2024–2025", "label": "Adversaries collect", "sub": "Encrypted traffic copied|State-level actors active", "color": "#F87171"}, {"when": "Near-term", "date": "2026–2028", "label": "NISQ era", "sub": "50–100 qubits|Limited attacks", "color": "#FBBF24"}, {"when": "Medium-term", "date": "2029–2032", "label": "Error correction", "sub": "1,000+ logical qubits|Broader capability", "color": "#FB923C"}, {"when": "Long-term", "date": "2033+", "label": "Crypto break", "sub": "RSA / ECC compromised|Old data decrypted", "color": "#34D399"}]}, "say": ["If quantum computers that can break RSA are years away, why act now?", "Because attackers don't need to wait to start. They can copy encrypted data today, even though they can't read it, and store it.", "This is called harvest now, decrypt later. The chapter notes that state-level actors are already doing it.", "The chapter sketches a timeline. In the near term, today's noisy quantum machines, the NISQ era, have around 50 to 100 qubits and only limited attacks.", "In the medium term, error correction could bring a thousand or more reliable, logical qubits.", "In the long term, perhaps from 2033, full use of Shor's algorithm could break RSA and ECC. Every harvested message would then be readable.", "These dates are projections, not certainties. The instructor manual estimates five to fifteen years.", "Here is the simple test. If your data must stay secret for longer than it will take to build such a machine, plus the years it takes you to switch, it is already at risk.", "That is why the chapter says: implement post-quantum cryptography now."], "hl": [null, 0, 0, 0, 0, 1, 1, 2, 3, 3, -1, -1, -1, -1, -1]}], "keyPoint": "Attackers can steal encrypted data now and decrypt it once quantum computers arrive. Anything that must stay secret for years is already at risk, so migration must start now.", "plain": ["Copy now, read later: the theft happens today.", "Dates in the timeline are estimates.", "Long-lived secrets (health, government, legal) are the most urgent."], "check": {"q": "Which data is most urgent to protect with post-quantum cryptography?", "o": ["Data that must stay secret for many years", "Today's weather forecast", "Public web pages"], "a": 0, "e": "Long-lived secrets can be harvested now and decrypted later.", "retry": {"q": "What does 'harvest now, decrypt later' mean?", "o": ["Decrypt data immediately he true one is believed to be very hard, even for a quantum computer. Kyber's version of this is called Module Learning with Errors."], "hl": [null, null, null, null, null, null, 1, 1, 1, 1]}, {"scene": {"type": "panels", "title": "NIST post-quantum standards", "subtitle": "Names in the chapter, with their official standard names", "items": [{"label": "CRYSTALS-Kyber", "color": "#38BDF8", "lines": ["Now ML-KEM (FIPS 203)", "Key encapsulation: agreeing a shared key", "Module Learning with Errors (lattice)", "Use: TLS, web security"]}, {"label": "CRYSTALS-Dilithium", "color": "#FB923C", "lines": ["Now ML-DSA (FIPS 204)", "Digital signatures", "Lattice-based, general purpose", "Use: code signing, PKI certificates"]}, {"label": "FALCON", "color": "#A78BFA", "lines": ["Being standardised as FN-DSA", "Compact signatures", "NTRU lattice-based", "Use: IoT, constrained devices, blockchain"]}], "note": "NIST also published SLH-DSA (from SPHINCS+, FIPS 205), a hash-based signature scheme"}, "say": ["The chapter highlights three algorithms.", "CRYSTALS-Kyber is a key encapsulation mechanism. It lets two parties agree a shared secret key, for example to protect web traffic in TLS. In 2024 NIST published it as ML-KEM.", "CRYSTALS-Dilithium is a digital signature scheme for general use, such as signing software updates and certificates. NIST published it as ML-DSA.", "FALCON produces especially compact signatures, useful for IoT devices and blockchains where space is tight. It is being standardised as FN-DSA.", "NIST also published a hash-based signature standard, SLH-DSA, from an algorithm called SPHINCS+. It gives a backup that does not rely on lattices.", "You will see both the original names and the new ones in documents, so it is worth knowing both."], "hl": [null, 0, 0, 0, 1, 1, 2, 2, -1, -1, -1]}], "keyPoint": "Kyber (ML-KEM) for agreeing keys; Dilithium (ML-DSA) and FALCON (FN-DSA) for signatures. They are lattice-based and run on ordinary computers.", "plain": ["Post-quantum does not mean 'runs on a quantum computer'.", "Lattice problems: finding a hidden point from a noisy one is very hard.", "Key exchange → Kyber/ML-KEM. Signatures → Dilithium/ML-DSA or FALCON."], "check": {"q": "Which algorithm would you use to agree a shared key for a secure website connection?", "o": ["Grover's algorithm", "CRYSTALS-Dilithium (ML-DSA)", "CRYSTALS-Kyber (ML-KEM)"], "a": 2, "e": "Kyber is the key encapsulation mechanism; Dilithium is for signatures.", "retry": {"q": "Why is FALCON suggested for IoT devices?", "o": ["Its signatures are compact", "It needs a quantum computer", "It is not lattice-based"], "a": 0, "e": "Compact signatures suit constrained devices."}}, "scenario": {"title": "The software update pipeline", "setting": "You protect how your company signs software updates for 100,000 smart meters.", "steps": [{"prompt": "Which algorithm family should replace your RSA code-signing?", "choices": [{"t": "A post-quantum signature scheme such as Dilithium (ML-DSA) or FALCON", "s": 2, "fb": "Right. Code signing needs a signature scheme."}, {"t": "Keep RSA forever", "s": 0, "fb": "No. Shor's algorithm will break RSA signatures."}, {"t": "Kyber (ML-KEM)", "s": 1, "fb": "Partly. Kyber agrees keys; it doesn't sign code."}]}, {"prompt": "The meters have very little storage for signatures. Which fits best?", "choices": [{"t": "The largest signature available", "s": 0, "fb": "No. That wastes scarce storage."}, {"t": "FALCON, for its compact signatures", "s": 2, "fb": "Right. The chapter links FALCON to IoT and constrained devices."}, {"t": "No signatures", "s": 0, "fb": "No. Unsigned updates are a firmware threat."}]}]}}, {"title": "Moving safely: hybrid and agile", "minutes": 2, "slides": [{"scene": {"type": "panels", "title": "Three rules for the transition", "subtitle": "From the chapter's key takeaways", "items": [{"label": "Hybrid", "color": "#38BDF8", "lines": ["Use classical + post-quantum together", "Attacker must break both", "Safe even if one has a hidden flaw", "Defence in depth during the transition"]}, {"label": "Crypto-agility", "color": "#34D399", "lines": ["Design to swap algorithms quickly", "Standards will keep evolving", "No hard-wired algorithms", "Keep an inventory of crypto use"]}, {"label": "Side-channel awareness", "color": "#F87171", "lines": ["New code brings new leaks", "Timing and power analysis", "Lattice rejection sampling can leak", "Test implementations carefully"]}]}, "say": ["Switching the world's cryptography is a huge job. The chapter gives three rules for doing it safely.", "First, go hybrid. Combine a classical algorithm and a post-quantum one, so an attacker has to break both.", "That protects you if the new algorithm turns out to have an undiscovered weakness. It is defence in depth for the transition period.", "Second, build cryptographic agility. Design systems so algorithms can be swapped quickly, without rebuilding everything.", "Standards will keep changing, as the renaming of Kyber and Dilithium already shows.", "Third, watch for side-channel attacks. New implementations can leak secrets through timing or power use.", "The instructor manual gives an example: in lattice-based schemes, a step called rejection sampling can leak key information through timing.", "So the algorithm may be strong while the implementation is weak. Test carefully."], "hl": [null, null, 0, 0, 0, 0, 1, 1, 1, 2, 2, 2, -1, -1]}], "keyPoint": "During the transition: combine classical and post-quantum (hybrid), design to swap algorithms quickly (agility), and test new implementations for side-channel leaks.", "plain": ["Hybrid: two locks, so breaking one is not enough.", "Agility: make algorithms easy to replace.", "Side-channels: a strong algorithm can still leak through timing or power."], "check": {"q": "Why use a hybrid of classical and post-quantum cryptography?", "o": ["It removes the need for keys", "It is faster", "An attacker must break both, so a hidden flaw in one isn't fatal"], "a": 2, "e": "Hybrid gives defence in depth while new algorithms mature.", "retry": {"q": "What is cryptographic agility?", "o": ["Encrypting faster", "Being able to switch algorithms quickly as threats and standards change", "Using only one algorithm forever"], "a": 1, "e": "Agility avoids hard-wiring a single algorithm."}}, "scenario": {"title": "The new payment system", "setting": "Your team is designing a payment platform that must run for 15 years.", "steps": [{"prompt": "The architect wants to hard-code a single post-quantum algorithm everywhere. Your advice?", "choices": [{"t": "Hard-code it; it's the newest", "s": 0, "fb": "No. A future flaw would force a rebuild."}, {"t": "Stay with RSA only", "s": 0, "fb": "No. RSA will be broken by Shor's algorithm."}, {"t": "Design for crypto-agility so algorithms can be swapped", "s": 2, "fb": "Right. Fifteen years will bring new standards and new attacks."}]}, {"prompt": "Testing shows decryption time varies slightly with the secret key. What is this?", "choices": [{"t": "A possible timing side-channel to fix before launch", "s": 2, "fb": "Right. Timing differences can leak keys."}, {"t": "A quantum attack", "s": 0, "fb": "No. It's a classical side-channel in the implementation."}, {"t": "Normal and harmless", "s": 0, "fb": "No. The chapter warns about exactly this."}]}]}}, {"title": "Protecting AI layer by layer", "minutes": 2, "slides": [{"scene": {"type": "stack", "title": "Quantum-resistant AI security architecture", "subtitle": "Defence in depth across five layers", "flow": "up", "items": [{"label": "L1 Data input", "sub": "Post-quantum encryption · secure ingestion", "color": "#F87171"}, {"label": "L2 Model training", "sub": "Secure multi-party computation · federated learning · differential privacy", "color": "#FBBF24"}, {"label": "L3 Inference", "sub": "Homomorphic encryption · privacy-preserving predictions · secure enclaves", "color": "#34D399"}, {"label": "L4 Model storage", "sub": "Quantum-safe key management · encrypted weights", "color": "#38BDF8"}, {"label": "L5 Communication", "sub": "Hybrid PQC · TLS 1.3 with Kyber · secure APIs", "color": "#A78BFA"}]}, "say": ["An AI security system has many parts, and each one needs protecting. The chapter uses five layers.", "Layer one is data input. Incoming data is protected with post-quantum encryption as it is collected.", "Layer two is model training. Secure multi-party computation, federated learning and differential privacy let several parties train together without exposing data.", "Layer three is inference, when the model makes predictions. Homomorphic encryption lets the model compute on data while it is still encrypted, although it is slow. Secure enclaves protect computation inside the chip.", "Layer four is model storage. The model's weights are encrypted, with quantum-safe key management.", "Layer five is communication: hybrid post-quantum protocols such as TLS 1 point 3 with Kyber, and secure API endpoints.", "Notice that not every control is about quantum attacks. Federated learning and differential privacy protect privacy. Together they give defence in depth."], "hl": [null, null, 0, 0, 1, 1, 2, 2, 2, 3, 3, 4, -1, -1, -1]}], "keyPoint": "Protect all five layers — data input, training, inference, storage and communication. Some controls are quantum-specific, others protect privacy; together they give defence in depth.", "plain": ["Every stage of an AI system can be attacked.", "Homomorphic encryption: compute on locked data, at a speed cost.", "Use post-quantum protocols wherever keys and data travel or rest."], "check": {"q": "Which layer does TLS 1.3 with Kyber protect?", "o": ["Communication", "Inference", "Model training"], "a": 0, "e": "TLS protects data travelling between systems.", "retry": {"q": "What does homomorphic encryption allow?", "o": ["Breaking RSA", "Computing on data while it stays encrypted", "Training without data"], "a": 1, "e": "It enables privacy-preserving predictions, with significant performance overhead."}}, "scenario": {"title": "The cloud detection service", "setting": "Your company sends customer network logs to a cloud AI service that predicts attacks.", "steps": [{"prompt": "Customers don't want the cloud provider to see their logs at all. Which control fits?", "choices": [{"t": "Turn off logging", "s": 0, "fb": "No. Then there is nothing to detect with."}, {"t": "Homomorphic encryption or secure enclaves at the inference layer", "s": 2, "fb": "Right. The model can work on protected data."}, {"t": "Bigger servers", "s": 0, "fb": "No. That changes speed, not privacy."}]}, {"prompt": "The model weights sit on a shared server, protected by RSA-wrapped keys. What do you change?", "choices": [{"t": "Nothing; weights aren't valuable", "s": 0, "fb": "No. A stolen model can be copied or attacked."}, {"t": "Publish the weights", "s": 0, "fb": "No. That removes the protection entirely."}, {"t": "Move to quantum-safe key management for the model storage layer", "s": 2, "fb": "Right. RSA-wrapped keys are exposed to future quantum attacks."}]}]}}, {"title": "Beyond quantum: brain-inspired detection", "minutes": 2, "slides": [{"scene": {"type": "flow", "title": "Neuromorphic computing for security", "subtitle": "Event-driven processing pipeline", "items": [{"label": "Network traffic", "sub": "Packets arrive"}, {"label": "Event encoding", "sub": "Changes become|spike trains", "icon": "spikes", "color": "#FB923C"}, {"label": "Spiking neural network", "sub": "Low power|Event-driven", "color": "#A78BFA"}, {"label": "Threat classification", "sub": "Anomaly detection", "color": "#34D399"}, {"label": "Response action", "sub": "Block or alert", "color": "#F87171"}], "note": "Chapter claims: up to 1000x more energy-efficient than GPUs · microsecond responses"}, "say": ["The chapter's title says quantum computing and beyond. Beyond means other new kinds of computing that can help defenders.", "Neuromorphic computing uses chips inspired by the brain. Instead of processing everything all the time, they react only to events: things that change.", "Network traffic arrives.", "It is encoded as spike trains, short pulses, a bit like nerve signals.", "A spiking neural network processes the spikes. When nothing is happening, it uses almost no power.", "It classifies the activity, spotting anomalies that may be attacks.", "And it can trigger a response, such as blocking the traffic, within microseconds.", "The chapter reports energy efficiency up to a thousand times better than GPUs, though real figures depend heavily on the task. That makes it promising for always-on detection on IoT and edge devices, linking back to Chapter 1."], "hl": [null, null, null, null, 0, 1, 2, 2, 3, 4, -1, -1]}], "keyPoint": "Neuromorphic chips process only events, so they can watch traffic continuously with very little power and react in microseconds — ideal for edge and IoT detection.", "plain": ["Brain-inspired: work only when something changes.", "Very low power, very fast reactions.", "Best suited to always-on monitoring at the edge."], "check": {"q": "Why are neuromorphic chips suited to always-on monitoring?", "o": ["They store more data", "They are quantum computers", "They are event-driven and use almost no power when idle"], "a": 2, "e": "Event-driven processing means near-zero activity when nothing changes.", "retry": {"q": "What does a spiking neural network process?", "o": ["Spike trains: short pulses representing events", "Encryption keys", "Whole video files"], "a": 0, "e": "Traffic is encoded into spike trains."}}, "scenario": {"title": "The remote wind farm", "setting": "A wind farm's IoT gateway runs on solar power with no reliable cloud connection.", "steps": [{"prompt": "Which detection approach suits it best?", "choices": [{"t": "Stream all traffic to a GPU cluster in the cloud", "s": 0, "fb": "No. The connection and power budget can't support it."}, {"t": "No monitoring", "s": 0, "fb": "No. Remote sites are still targets."}, {"t": "A low-power, event-driven neuromorphic or edge AI detector on site", "s": 2, "fb": "Right. It works locally, with little power and fast response."}]}, {"prompt": "A vendor promises '1000x more efficient than GPUs' for your exact workload. What do you do?", "choices": [{"t": "Ask for measurements on a workload like ours before deciding", "s": 2, "fb": "Right. Headline figures vary heavily by task."}, {"t": "Accept the figure as fact", "s": 0, "fb": "No. The chapter's figure is a general claim."}, {"t": "Reject neuromorphic computing entirely", "s": 0, "fb": "No. Test it rather than dismiss it."}]}]}}], "test": [{"q": "Shor's algorithm gives what kind of speed-up for factoring?", "o": ["Quadratic", "None", "Exponential"], "a": 2, "e": "That is why it breaks RSA and ECC completely.", "lesson": 0}, {"q": "Grover's algorithm reduces AES-128 to about…", "o": ["0 bits", "64-bit effective strength", "256 bits"], "a": 1, "e": "It halves the security strength.", "lesson": 0}, {"q": "Which is a common misconception?", "o": ["Post-quantum algorithms run on quantum computers", "RSA is threatened by Shor", "AES-256 remains secure"], "a": 0, "e": "PQC runs on ordinary computers.", "lesson": 2}, {"q": "'Harvest now, decrypt later' makes which data most urgent?", "o": ["Data deleted daily", "Data that must stay secret for many years", "Public data"], "a": 1, "e": "Long-lived secrets are at risk today.", "lesson": 1}, {"q": "In the chapter's timeline, roughly when could RSA and ECC be broken?", "o": ["Last year", "Never", "2033 and later (a projection)"], "a": 2, "e": "The dates are estimates; the manual says 5–15 years.", "lesson": 1}, {"q": "CRYSTALS-Kyber is now standardised as…", "o": ["ML-KEM", "ML-DSA", "SHA-3"], "a": 0, "e": "FIPS 203.", "lesson": 2}, {"q": "Which is used for digital signatures?", "o": ["Kyber (ML-KEM)", "AES", "Dilithium (ML-DSA)"], "a": 2, "e": "Dilithium is a signature scheme.", "lesson": 2}, {"q": "The security of Kyber rests on…", "o": ["Factoring", "Module Learning with Errors (a lattice problem)", "Discrete logarithms"], "a": 1, "e": "A lattice problem believed hard for quantum computers.", "lesson": 2}, {"q": "What is the main benefit of hybrid cryptography?", "o": ["An attacker must break both classical and post-quantum schemes", "It uses no keys", "It is cheaper"], "a": 0, "e": "Defence in depth during the transition.", "lesson": 3}, {"q": "Rejection sampling in lattice schemes can leak keys through…", "o": ["Blockchain", "Timing side-channels", "Federated learning"], "a": 1, "e": "An implementation risk the manual highlights.", "lesson": 3}, {"q": "Homomorphic encryption mainly protects which AI layer in the chapter's architecture?", "o": ["Data input", "Communication", "Inference"], "a": 2, "e": "It allows privacy-preserving predictions.", "lesson": 4}, {"q": "Neuromorphic computing is best described as…", "o": ["Brain-inspired, event-driven, low-power processing", "A type of quantum computer", "A blockchain consensus method"], "a": 0, "e": "It reacts to events using spiking neural networks.", "lesson": 5}]};

function h(tag, attrs, ...kids){ const e=document.createElement(tag); if(attrs) for(const [k,v] of Object.entries(attrs)){ if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) e.setAttribute(k,v===true?'':v);} for(const k of kids.flat()) if(k!=null&&k!==false) e.append(k.nodeType?k:document.createTextNode(k)); return e; }
const pad = n => String(n).padStart(2,'0');

function seg(options, value, onChange, label){ const w = h('div',{class:'seg',role:'group','aria-label':label||''}); const bs = options.map(([v,t]) => { const b = h('button',{type:'button','aria-pressed':String(v===value)}, t); b.onclick = () => { bs.forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); onChange(v); }; return b; }); w.append(...bs); return w; }

/* ---------------- metrics (Learning Index) ----------------
   Knowledge 35%: first-attempt quick checks + latest final-test answers correct
   Application 35%: points earned in case simulations (each choice 0–2)
   Self-awareness 15%: how often your confidence matched your answer (sure & right, or unsure & wrong)
   Completion 15%: lessons completed + final test taken
   Levels follow Benner's novice-to-expert stages (shortened for a short course). */
const LEVELS = [[0,'Novice','Starting out: knows the words, needs support to apply them'],[40,'Advanced beginner','Recognises the main ideas in familiar cases'],[60,'Competent','Applies the ideas to new cases and asks the right questions'],[80,'Proficient','Judges tools confidently and explains why to colleagues']];
function metrics(){
  const n = CH.lessons.length; let kOk=0,kN=0,aPts=0,aMax=0,cal=0,calN=0,done=0;
  for (let i=0;i<n;i++){ const l = S.lessons[i]; if (!l) continue;
    if (l.check){ kN++; if (l.check.ok) kOk++; if (l.check.conf){ calN++; if ((l.check.conf==='sure')===l.check.ok) cal++; } }
    aPts += l.caseScore||0; aMax += l.caseDone ? (l.caseMax||0) : 0; if (l.done) done++; }
  if (S.test){ S.test.answers.forEach(a=>{ kN++; if (a.ok) kOk++; if (a.conf){ calN++; if ((a.conf==='sure')===a.ok) cal++; } }); }
  const K = kN? kOk/kN : 0, A = aMax? aPts/aMax : 0, C = calN? cal/calN : null, P = (done + (S.test?1:0))/(n+1);
  const parts = [[K,.35],[A,.35],[P,.15]]; if (C!=null) parts.push([C,.15]);
  const wsum = parts.reduce((x,p)=>x+p[1],0); const idx = Math.round(100*parts.reduce((x,p)=>x+p[0]*p[1],0)/wsum);
  const lv = LEVELS.filter(l=>idx>=l[0]).pop();
  return {K,A,C,P,index:idx,level:lv[1],levelText:lv[2],kN,aMax,calN,done,n};

      s.choices.forEach(ch => { const b = h('button',{class:'opt',type:'button'}, ch.t); b.onclick = () => {
        opts.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add(ch.s===2?'right':ch.s===1?'part':'wrong');
        if (ch.s<2){ const best = s.choices.find(c=>c.s===2); if (best) [...opts.children].find(x=>x.textContent===best.t).classList.add('right'); }
        pts += ch.s; fb.innerHTML = `<b>${ch.s===2?'Good call.':ch.s===1?'Partly.':'Not the best choice.'}</b> ${ch.fb}`;
        k++; if (k < sc.steps.length) step(); else { st.caseDone = true; st.caseScore = pts; st.caseMax = maxPts; st.done = st.done || !!st.check; save(); renderSteps();
          host.append(h('p',{class:'fb',style:'margin-top:12px'}, h('span',{class: pts>=maxPts*0.75?'pill good':pts>=maxPts/2?'pill warn':'pill bad'}, `Case score: ${pts} of ${maxPts}`))); finishRow(); } };
        opts.append(b); });
      box.append(opts, fb); host.append(box);
    }
    step();
  }
  function finishRow(){
    st.done = !!(st.check && st.caseDone); save();
    const next = i < CH.lessons.length-1 ? h('button',{class:'btn primary',type:'button',onclick:()=>go('l'+(i+1))}, `Next: lesson ${i+2}`) : h('button',{class:'btn primary',type:'button',onclick:()=>go('final')}, 'Go to the final case test');
    caseCard.append(h('div',{class:'row',style:'margin-top:14px'}, next, h('button',{class:'btn',type:'button',onclick:()=>go('progress')},'See my progress')));
  }
  renderCheck(); renderCase(); layout();
}

/* generic question with confidence rating */
function askQuestion(host, q, practice, onDone, isRetry){
  const box = h('div'); host.append(box);
  if (!isRetry || true) box.append(h('p',{class:'q'}, q.q));
  let conf = null;
  const confSeg = seg([['sure','I\'m sure'],['unsure','I\'m not sure']], null, v=>conf=v, 'Confidence');
  if (!practice) box.append(h('div',{class:'conf'}, h('span',null,'Before you answer, how sure are you?'), confSeg, h('span',{style:'font-size:.8rem'},'(optional, helps your self-awareness score)')));
  const opts = h('div',{class:'opts'}); const fb = h('div',{class:'fb'});
  q.o.forEach((o,j)=>{ const b = h('button',{class:'opt',type:'button'}, o); b.onclick = () => {
    const ok = j===q.a; opts.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add(ok?'right':'wrong'); if (!ok) opts.children[q.a].classList.add('right');
    fb.innerHTML = `<b>${ok?'Right.':'Not quite.'}</b> ${q.e}`; onDone(ok, conf); };
    opts.append(b); });
  box.append(opts, fb);
}

/* ---------------- FINAL case test ---------------- */
function renderFinal(main){
  const M = metrics();
  main.append(h('div',null, h('div',{class:'eyebrow'},'Final case test'), h('h2',{style:'font-size:1.8rem;margin-top:4px'},'Check your learning path'), h('p',{class:'lede',style:'margin-top:6px'}, `${CH.test.length} short questions across all ${CH.lessons.length} lessons. You see the answer after each one. Your latest attempt counts towards your learning index, and the results show which lessons to revisit.`)));
  if (M.done < CH.lessons.length) main.append(h('div',{class:'card',style:'background:var(--signal-soft)'}, h('p',null, `You have finished ${M.done} of ${CH.lessons.length} lessons. You can take the test now, but you will probably score higher after finishing them.`)));
  const host = h('div',{class:'card'}); main.append(host);
  if (S.test) { host.append(h('p',null, h('span',{class:'pill acc'}, `Last attempt: ${S.test.score} of ${CH.test.length}`), ` · ${S.test.attempts} attempt${S.test.attempts>1?'s':''}`), h('div',{class:'row',style:'margin-top:10px'}, h('button',{class:'btn primary',type:'button',onclick:()=>{ host.innerHTML=''; runTest(host); }},'Take the test again'), h('button',{class:'btn',type:'button',onclick:()=>go('progress')},'See my results'))); return; }
  host.append(h('button',{class:'btn primary',type:'button',onclick:()=>{ host.innerHTML=''; runTest(host); }},'Start the test'));
}
function runTest(host){
  const answers = []; let k = 0;
  const prog = h('p',{class:'eyebrow'}); host.append(prog); const qhost = h('div'); host.append(qhost);
  function next(){
    qhost.innerHTML=''; prog.textContent = `Question ${k+1} of ${CH.test.length} · from lesson ${CH.test[k].lesson+1}: ${CH.lessons[CH.test[k].lesson].title}`;
    askQuestion(qhost, CH.test[k], false, (ok, conf) => { answers.push({ok, conf, lesson: CH.test[k].lesson});
      qhost.append(h('div',{class:'row',style:'margin-top:12px'}, h('button',{class:'btn primary',type:'button',onclick:()=>{ k++; if (k<CH.test.length) next(); else finish(); }}, k<CH.test.length-1?'Next question':'See my results'))); });
  }
  function finish(){ const score = answers.filter(a=>a.ok).length; S.test = {answers, score, attempts:(S.test?S.test.attempts:0)+1, at:Date.now()}; save(); go('progress'); }
  next();
}

/* ---------------- PROGRESS: learning index, advice, certificate ---------------- */
function gaugeSVG(v){
  const r=60, c=2*Math.PI*r, f=c*v/100;
  return `<svg viewBox="0 0 150 150" role="img" aria-label="Learning index ${v} out of 100"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="14"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${f} ${c}" transform="rotate(-90 75 75)"/><text x="75" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono, monospace">${v}</text><text x="75" y="102" text-anchor="middle" font-size="11" fill="var(--muted)">out of 100</text></svg>`;
}
function advice(){
  const out = []; const n = CH.lessons.length;
  const testBy = {}; if (S.test) S.test.answers.forEach(a=>{ (testBy[a.lesson] = testBy[a.lesson]||{ok:0,n:0}); testBy[a.lesson].n++; if (a.ok) testBy[a.lesson].ok++; });
  const weak = [];
  for (let i=0;i<n;i++){ const l = S.lessons[i]; const reasons = [];
    if (l && l.check && !l.check.ok) reasons.push('missed the quick check');
    if (l && l.caseDone && l.caseScore < l.caseMax*0.5) reasons.push(`scored ${l.caseScore} of ${l.caseMax} on the case`);
    if (testBy[i] && testBy[i].ok < testBy[i].n) reasons.push(`${testBy[i].n-testBy[i].ok} final-test question${testBy[i].n-testBy[i].ok>1?'s':''} wrong`);
    if (reasons.length) weak.push([i, reasons]); }
  weak.sort((a,b)=>b[1].length-a[1].length).slice(0,3).forEach(([i,r])=>out.push(['Revisit', `Lesson ${i+1}, ${CH.lessons[i].title}: you ${r.join(', ')}. Try it in Read mode and open "Explain more simply".`, 'l'+i]));
  const nf = [...Array(n).keys()].find(i=>!(S.lessons[i]&&S.lessons[i].done));
  if (nf!==undefined) out.push(['Next', `Carry on with lesson ${nf+1}, ${CH.lessons[nf].title}.`, 'l'+nf]);
  else if (!S.test) out.push(['Next', 'All lessons done. Take the final case test to check your learning path.', 'final']);
  const M = metrics();
  if (M.calN >= 4 && M.C < 0.6) out.push(['Self-awareness', 'Your confidence often did not match your answers. In security work, knowing when you are unsure matters as much as knowing the answer. Keep rating your confidence.', null]);
  if (S.plan && S.secs > 0){ const done = Object.values(S.lessons).filter(l=>l.done); const avg = done.length ? done.reduce((a,l)=>a+l.secs,0)/done.length/60 : 0;
    if (avg >= 0.5) out.push(['Your pace', `You spend about ${avg.toFixed(1)} minutes per lesson. ${avg > 6 ? 'Taking your time is fine. Shorter sittings may suit you better: try 5-minute sittings on the Start page.' : avg < 2.5 ? 'You move quickly. If the cases feel easy, the Fast track path lets you skip straight to them.' : 'That fits your plan well.'}`, null]); }
  if (!out.length) out.push(['Well done', 'No gaps found. You could teach this chapter to a colleague.', null]);
  return out;
}
function renderProgress(main){
  const M = metrics();
  main.append(h('div',null, h('div',{class:'eyebrow'},'My progress'), h('h2',{style:'font-size:1.8rem;margin-top:4px'},'Your learning index'), h('p',{class:'lede',style:'margin-top:6px'}, S.test ? 'Based on your lessons, cases and final test.' : 'Provisional until you take the final case test.')));
  const dims = [['Knowledge', M.K, 'Quick checks right first time, plus final-test answers'], ['Applying it', M.A, 'Points from the case simulations'], ['Self-awareness', M.C, 'How often your confidence matched your answer'], ['Completion', M.P, 'Lessons finished and final test taken']];
  const dimsEl = h('div',{class:'dims'}, dims.map(([n,v,d])=>h('div',null, h('div',{class:'dim'}, h('span',null,n), h('div',{class:'track'}, h('div',{class:'fill',style:`width:${v==null?0:pct(v)}%`})), h('output',null, v==null?'—':pct(v)+'%')), h('div',{style:'font-size:.78rem;color:var(--muted);margin:-4px 0 0'}, d))));
  const ladder = h('div',{class:'ladder'}, LEVELS.map(l=>h('div',{class: l[1]===M.level?'on':''}, l[1], h('br'), `${l[0]}+`)));
  main.append(h('div',{class:'card'}, h('div',{class:'gauge'}, h('div',{html:gaugeSVG(M.index)}), h('div',{style:'flex:1;min-width:240px'}, h('h3',null, M.level), h('p',{class:'lede'}, M.levelText), ladder)), h('div',{style:'margin-top:16px'}, dimsEl),
    h('p',{class:'foot',style:'margin-top:12px'},'How it is worked out: knowledge 35%, applying it 35%, self-awareness 15%, completion 15%. Levels follow the "novice to expert" stages widely used in professional education.')));
  const adv = h('div',{class:'advice'}, advice().map(([t,txt,v])=>h('div',null, h('span',{class:'pill acc',style:'flex:none'},t), h('span',{style:'flex:1'},txt), v ? h('button',{class:'btn small',type:'button',onclick:()=>go(v)},'Go') : null)));
  main.append(h('div',{class:'card'}, h('h3',null,'What to do next'), adv));
  const rows = CH.lessons.map((les,i)=>{ const l = S.lessons[i]||{}; return h('tr',null, h('td',null, `${i+1}. ${les.title}`), h('td',null, l.watched?'✓':'—'), h('td',null, l.check ? (l.check.ok ? h('span',{class:'pill good'},'Right') : h('span',{class:'pill warn'},'Missed')) : '—'), h('td',null, l.caseDone ? `${l.caseScore}/${l.caseMax}` : '—'), h('td',{class:'mono'}, l.secs ? (l.secs<60 ? '<1 min' : Math.round(l.secs/60)+' min') : '—')); });
  main.append(h('div',{class:'card'}, h('h3',null,'Lesson by lesson'), h('div',{class:'tablewrap'}, h('table',{class:'t'}, h('thead',null,h('tr',null, ['Lesson','Watched','Check','Case','Time'].map(t=>h('th',null,t)))), h('tbody',null,rows))),
    S.test ? h('p',{style:'margin-top:10px'}, h('span',{class:'pill acc'}, `Final test: ${S.test.score} of ${CH.test.length}`)) : null));
  // certificate
  const nameIn = h('input',{type:'text',id:'certName',placeholder:'Your name as it should appear',value:S.name||''});
  const certBtn = h('button',{class:'btn primary',type:'button'},'Download certificate');
  const note = h('p',{class:'foot'});
  const eligible = S.test && M.index >= 60;
  certBtn.disabled = !eligible; note.textContent = eligible ? 'Saves a picture of your certificate. Your score is calculated in your own browser, so keep the file as your record.' : 'Available once you have taken the final case test and reached Competent (60 or more).';
  certBtn.onclick = () => { S.name = nameIn.value.trim(); save(); makeCert(S.name || 'Learner', M); };
  main.append(h('div',{class:'card'}, h('h3',null,'Certificate'), h('div',{class:'row'}, nameIn, certBtn), note,
    h('div',{class:'row',style:'margin-top:14px'}, h('button',{class:'btn small',type:'button',onclick:()=>{ resetBox.hidden = false; }},'Start this chapter again'))));
  const resetBox = h('div',{class:'card',hidden:true,style:'background:var(--bad-soft)'}, h('p',null,'This clears your plan, answers and scores for this chapter in this browser. It cannot be undone.'), h('div',{class:'row',style:'margin-top:10px'}, h('button',{class:'btn',type:'button',onclick:()=>{ S = blank(); save(); go('start'); }},'Yes, clear this chapter'), h('button',{class:'btn',type:'button',onclick:()=>{ resetBox.hidden=true; }},'Keep my progress')));
  main.append(resetBox);
}
function makeCert(name, M){
  const c = document.createElement('canvas'); c.width = 1600; c.height = 1130; const x = c.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.fillRect(0,0,1600,1130); x.strokeStyle = '#1D4E89'; x.lineWidth = 14; x.strokeRect(40,40,1520,1050); x.lineWidth = 2; x.strokeRect(70,70,1460,990);
  x.fillStyle = '#1D4E89'; x.textAlign = 'center'; x.font = '600 30px Georgia, serif'; x.fillText('GUIDE TO AI FOR CYBERSECURITY', 800, 180);
  x.fillStyle = '#14232A'; x.font = '600 72px Georgia, serif'; x.fillText('Certificate of learning', 800, 290);
  x.font = '28px Arial, sans-serif'; x.fillStyle = '#55686D'; x.fillText('This is to record that', 800, 380);
  x.fillStyle = '#14232A'; x.font = '600 64px Georgia, serif'; x.fillText(name.slice(0,48), 800, 470);
  x.font = '28px Arial, sans-serif'; x.fillStyle = '#55686D'; x.fillText('has completed', 800, 550);
  x.fillStyle = '#14232A'; x.font = '600 40px Georgia, serif'; x.fillText((CH.num==='A'?'Appendix A: ':'Chapter '+CH.num+': ') + CH.title, 800, 620, 1400);
  x.fillStyle = '#1D4E89'; x.font = '600 46px Arial, sans-serif'; x.fillText(`Learning index ${M.index} / 100  ·  ${M.level}`, 800, 740);
  x.fillStyle = '#55686D'; x.font = '24px Arial, sans-serif';
  x.fillText(`Knowledge ${pct(M.K)}%   ·   Applying it ${pct(M.A)}%   ·   Self-awareness ${M.C==null?'—':pct(M.C)+'%'}   ·   Final test ${S.test.score}/${CH.test.length}`, 800, 800);
  x.fillText('Issued ' + new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) + '  ·  Self-assessed online course record, calculated in the learner\'s browser', 800, 980);
  c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `certificate-${CH.id}.png`; document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); });
}

/* ---------------- boot ---------------- */
$('#chNum').textContent = CH.num==='A' ? 'Appendix A' : 'Chapter '+CH.num;
$('#chTitle span').textContent = CH.title;
const hv = (location.hash||'').slice(1);
go(views().includes(hv) ? hv : (S.plan ? 'l'+firstUnfinished() : 'start'));
</script>
